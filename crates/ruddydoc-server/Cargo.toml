[package]
name = "ruddydoc-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP REST API and MCP server for RuddyDoc document conversion"
# Depends transitively on ruddydoc-graph, which pins Sparq via a git
# dependency (not on crates.io yet); can't publish until Sparq is.
# See LICENSES.md "Special Consideration: Sparq".
publish = false

[dependencies]
ruddydoc-core = { workspace = true }
ruddydoc-graph = { workspace = true }
ruddydoc-converter = { workspace = true }
ruddydoc-export = { workspace = true }
ruddydoc-ontology = { workspace = true }
ruddydoc-models = { workspace = true, default-features = false, features = ["embeddings-api", "llm-api"] }

axum = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
