[package]
name = "ruddydoc-ontology"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Document ontology definitions and SHACL shapes for RuddyDoc"
# Depends transitively on ruddydoc-graph, which pins Sparq via a git
# dependency (not on crates.io yet); can't publish until Sparq is.
# See LICENSES.md "Special Consideration: Sparq".
publish = false

[dependencies]
ruddydoc-core = { workspace = true }
ruddydoc-graph = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
