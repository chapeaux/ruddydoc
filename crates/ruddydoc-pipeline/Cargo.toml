[package]
name = "ruddydoc-pipeline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Document processing pipeline orchestration for RuddyDoc"
# Depends transitively on ruddydoc-graph, which pins Sparq via a git
# dependency (not on crates.io yet); can't publish until Sparq is.
# See LICENSES.md "Special Consideration: Sparq".
publish = false

[features]
default = []

[dependencies]
ruddydoc-core = { workspace = true }
ruddydoc-graph = { workspace = true }
ruddydoc-ontology = { workspace = true }
ruddydoc-models = { workspace = true, default-features = false }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
ruddydoc-graph = { workspace = true }
